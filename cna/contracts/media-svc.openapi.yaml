components:
  securitySchemes:
    ServiceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Credencial de consumidor autorizada para este servicio. Se configura como secreto y no es el
        token de la API de BookStack.
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            request_id:
              $ref: "#/components/schemas/RequestId"
          required:
            - code
            - message
            - request_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          minLength: 1
      required:
        - status
        - service
      additionalProperties: false
    Ready:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
        service:
          type: string
          minLength: 1
      required:
        - status
        - service
      additionalProperties: false
    Media:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
        size_bytes:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        thumbnail:
          type: object
          properties:
            url:
              type: string
              format: uri
            width:
              type: integer
              minimum: 1
              maximum: 320
            height:
              type: integer
              minimum: 1
              maximum: 320
          required:
            - url
            - width
            - height
          additionalProperties: false
      required:
        - media_id
        - filename
        - content_type
        - size_bytes
        - width
        - height
        - created_at
        - url
        - thumbnail
      additionalProperties: false
