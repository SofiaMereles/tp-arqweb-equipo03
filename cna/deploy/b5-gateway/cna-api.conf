# Gateway incremental: S1. Las otras rutas se agregaran al implementar S3/S4.
log_format cna_api_json escape=json
  '{"timestamp":"$time_iso8601","level":"info","service":"gateway",'
  '"request_id":"$request_id","message":"http_request",'
  '"method":"$request_method","path":"$uri","status":$status,"latency":$request_time}';

limit_req_zone $binary_remote_addr zone=cna_api_limit:10m rate=10r/s;

upstream cna_search_upstream {
    server 192.168.145.130:8081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.bookstack.local;
    return 301 https://api.bookstack.local$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.bookstack.local;

    ssl_certificate /etc/ssl/certs/bookstack.crt;
    ssl_certificate_key /etc/ssl/private/bookstack.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/cna-api.access.log cna_api_json;
    error_log /var/log/nginx/cna-api.error.log warn;

    limit_req_status 429;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @service_unavailable;

    location = /v2/search {
        limit_req zone=cna_api_limit burst=20 nodelay;
        proxy_pass http://cna_search_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header traceparent $http_traceparent;
        proxy_hide_header X-Request-ID;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_intercept_errors on;
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"Servicio temporalmente no disponible.","request_id":"$request_id"}}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Se excedio el limite de solicitudes.","request_id":"$request_id"}}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Ruta no disponible.","request_id":"$request_id"}}';
    }
}
